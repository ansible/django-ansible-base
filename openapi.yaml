    CleanTextFieldInfo:
      type: object
      description: Per-field metadata returned in OPTIONS actions. When ENHANCED_INPUT_VALIDATION_ENABLED
        is on, CharField/TextField entries on CleanTextMixin serializers may also
        include pattern hint keys. Tier-1 name fields may include normalize=NFC; tier-2
        fields do not.
      properties:
        type:
          type: string
        hidden:
          type: boolean
        label:
          type: string
        help_text:
          type: string
        filterable:
          type: boolean
        required:
          type: boolean
        max_length:
          type: integer
        default: {}
        pattern:
          type: string
          nullable: true
          description: Regex pattern (ECMAScript-compatible, no delimiters) that API
            clients can use for real-time client-side validation before submit. UX
            convenience only -- the server independently enforces validation, so clients
            must not treat this as a substitute for handling server-side errors. Omitted
            when ENHANCED_INPUT_VALIDATION_ENABLED is off, or when the field has no
            validation rule (non-text, excluded, or secret).
        patternDescription:
          type: string
          nullable: true
          description: Human-readable explanation of `pattern`, suitable for display
            next to the field. Present under the same condition as `pattern` -- the
            two always appear or are absent together.
        flags:
          type: string
          nullable: true
          description: Regex flags to apply when evaluating `pattern` (e.g. "u" for
            Unicode mode, "i" for case-insensitive). Present under the same condition
            as `pattern`.
        normalize:
          type: string
          nullable: true
          enum:
          - NFC
          description: Unicode normalization form to apply before evaluating `pattern`.
            Requires ENHANCED_INPUT_VALIDATION_ENABLED and a tier-1 "name" field --
            narrower than the other three keys, so it can be absent even when `pattern`
            is present. Not used on nested JSON field catalogs (credential inputs,
            etc.).
      required:
      - type
      - hidden
      - label
      additionalProperties: true
