          description: Stable field identifier (used in inputs.required and credential
            payloads).
        label:
          type: string
          description: Human-readable field label.
        type:
          type: string
          description: Field type (e.g. string, boolean). Pattern hints apply to non-secret
            strings.
        help_text:
          type: string
        secret:
          type: boolean
          description: When true, pattern hints are omitted.
        default:
          description: Optional default value (string, boolean, etc.).
        multiline:
          type: boolean
        format:
          type: string
        ask_at_runtime:
          type: boolean
        pattern:
          type: string
          nullable: true
          description: Regex pattern (ECMAScript-compatible, no delimiters) that API
