---
name: CI
on:
  pull_request:
  push:
    branches:
      - devel
      - "stable-*"
jobs:
  tox:
    name: django-ansible-base - ${{ matrix.tests.env }}
    # Pin to 24.04: ubuntu-latest (26.04) ships libxmlsec1 1.3.x / libxml2 2.15.x,
    # which cannot source-build our UBI9-compatible pins (xmlsec==1.3.13, lxml==5.3.0).
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        tests:
          - env: py312-check
            python-version: "3.12"
            sonar: false
            junit-xml-upload: false
          - env: py312
            python-version: "3.12"
            sonar: true
            junit-xml-upload: true
          - env: py312-sqlite
            python-version: "3.12"
            sonar: false
            junit-xml-upload: false
          - env: py312-mssql-check
            python-version: "3.12"
            sonar: false
            junit-xml-upload: false
          - env: py312-mssql
            python-version: "3.12"
            sonar: false
            junit-xml-upload: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
          persist-credentials: false

      - name: Install build requirements
        run: sudo apt-get update && sudo apt-get install -y libsasl2-dev libldap2-dev libssl-dev libxmlsec1-dev

      - name: Install MS SQL Server ODBC Driver
        if: contains(matrix.tests.env, 'mssql')
        run: |
          set -euo pipefail
          key_dir="$(mktemp -d)"
          trap 'rm -rf "$key_dir"' EXIT

          curl --fail --silent --show-error --location \
            https://packages.microsoft.com/keys/microsoft.asc \
            --output "$key_dir/microsoft.asc"
          key_fingerprint="$(gpg --show-keys --with-colons "$key_dir/microsoft.asc" | awk -F: '$1 == "fpr" { print $10; exit }')"
          # Microsoft publishes this signing-key fingerprint for the Ubuntu 24.04 repository.
          expected_fingerprint="BC528686B50D79E339D3721CEB3E94ADBE1229CF"
          if [[ "$key_fingerprint" != "$expected_fingerprint" ]]; then
            printf 'Unexpected Microsoft signing key fingerprint: %s\n' "$key_fingerprint" >&2
            exit 1
          fi

          gpg --dearmor --output "$key_dir/microsoft.gpg" "$key_dir/microsoft.asc"
          sudo install -d -m 0755 /usr/share/keyrings
          sudo install -o root -g root -m 0644 "$key_dir/microsoft.gpg" /usr/share/keyrings/microsoft-archive-keyring.gpg
          printf 'deb [arch=amd64 signed-by=/usr/share/keyrings/microsoft-archive-keyring.gpg] https://packages.microsoft.com/ubuntu/%s/prod %s main\n' \
            "$(lsb_release -rs)" "$(lsb_release -cs)" \
            | sudo tee /etc/apt/sources.list.d/mssql-release.list >/dev/null
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      - name: Install python ${{ matrix.tests.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.tests.python-version }}

      - name: Install tox
        run: pip${{ matrix.tests.python-version }} install tox tox-docker

      - name: Run tox
        env:
          TOX_DOCKER_GATEWAY: "127.0.0.1"
        run: |
          echo "::remove-matcher owner=python::"  # Disable annoying annotations from setup-python
          tox --colored yes -e ${{ matrix.tests.env }}

      - name: Inject PR number into coverage.xml
        if: matrix.tests.env != 'check' && hashFiles('coverage.xml') != ''
        run: sed -i '2i <!-- PR ${{ github.event.number }} -->' coverage.xml

      - name: Upload coverage as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.tests.env != 'check' && hashFiles('coverage.xml') != ''
        with:
          name: coverage-${{ matrix.tests.env }}
          path: coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: matrix.tests.env != 'check' && hashFiles('coverage.xml') != ''
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: ${{ matrix.tests.env }}
          fail_ci_if_error: false

      - name: Upload jUnit XML test results
        if: matrix.tests.junit-xml-upload && github.event_name == 'push' && github.repository == 'ansible/django-ansible-base' && github.ref_name == 'devel'
        continue-on-error: true
        run: >-
          curl --silent --show-error --user "$PDE_UPLOAD_USER:$PDE_UPLOAD_PASSWORD"
          --form "xunit_xml=@django-ansible-base-test-results.xml"
          --form "component_name=django-ansible-base"
          --form "git_commit_sha=${{ github.sha }}"
          --form "git_repository_url=https://github.com/${{ github.repository }}"
          "${{ vars.PDE_ORG_RESULTS_AGGREGATOR_UPLOAD_URL }}/api/results/upload/"
        env:
          PDE_UPLOAD_USER: ${{ vars.PDE_ORG_RESULTS_AGGREGATOR_UPLOAD_USER }}
          PDE_UPLOAD_PASSWORD: ${{ secrets.PDE_ORG_RESULTS_UPLOAD_PASSWORD }}

  query-count-scale:
    name: "Query count scale tests"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
          persist-credentials: false

      - name: Install build requirements
        run: sudo apt-get update && sudo apt-get install -y libsasl2-dev libldap2-dev libssl-dev libxmlsec1-dev

      - name: Install python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install tox
        run: pip3.12 install tox tox-docker

      - name: Run tox
        env:
          TOX_DOCKER_GATEWAY: "127.0.0.1"
        run: |
          echo "::remove-matcher owner=python::"  # Disable annoying annotations from setup-python
          tox --colored yes -e py312-query-count-scale

      - name: Inject PR number into coverage.xml
        if: hashFiles('coverage.xml') != ''
        run: sed -i '2i <!-- PR ${{ github.event.number }} -->' coverage.xml

      - name: Upload coverage as artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: hashFiles('coverage.xml') != ''
        with:
          name: coverage-py312-query-count-scale
          path: coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: hashFiles('coverage.xml') != ''
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: py312-query-count-scale
          fail_ci_if_error: false

  canary-deps:
    name: "Canary (unpinned deps, may fail) - ${{ matrix.tests.env }}"
    if: >-
      github.repository == 'ansible/django-ansible-base'
      && (
        (github.event_name == 'push' && github.ref_name == 'devel')
        || (github.event_name == 'pull_request' && github.base_ref == 'devel')
      )
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        tests:
          - env: py312-in-files
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
          persist-credentials: false

      - name: Install build requirements
        run: sudo apt-get update && sudo apt-get install -y libsasl2-dev libldap2-dev libssl-dev libxmlsec1-dev

      - name: Install python ${{ matrix.tests.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.tests.python-version }}

      - name: Install tox
        run: pip${{ matrix.tests.python-version }} install tox tox-docker

      - name: Run tox
        env:
          TOX_DOCKER_GATEWAY: "127.0.0.1"
        run: |
          echo "::remove-matcher owner=python::"
          tox --colored yes -e ${{ matrix.tests.env }}
