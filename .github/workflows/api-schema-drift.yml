---
# Drift detection: regenerate the OpenAPI spec from code and fail if the
# committed openapi.yaml is out of sync. Ensures developers commit spec
# changes alongside code changes.
# Jira: AAP-102911
name: "API: Schema Drift Detection"

on:
  pull_request:
    branches:
      - devel
      - stable-*
  push:
    branches:
      - devel

permissions:
  contents: read

jobs:
  drift:
    name: Check schema drift
    # Pin to 24.04: ubuntu-latest (26.04) ships libxmlsec1 1.3.x / libxml2 2.15.x,
    # which cannot source-build our UBI9-compatible pins (xmlsec==1.3.13, lxml==5.3.0).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      LC_ALL: "C.UTF-8"
      PYTHONHASHSEED: "0"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false

      - name: Verify committed spec exists
        run: |
          if ! git show HEAD:openapi.yaml > /dev/null 2>&1; then
            echo "::error::openapi.yaml is not in the commit — the baseline spec must be committed."
            exit 1
          fi

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libsasl2-dev libldap2-dev libssl-dev libxmlsec1-dev

      - name: Install python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: 3.12

      - name: Install requirements
        run: pip3.12 install -r requirements/requirements_all.txt -r requirements/requirements_dev.txt

      - name: Regenerate spec from code
        run: python3.12 tools/scripts/genschema.py

      - name: Check for drift
        run: |
          set +e
          git diff --exit-code openapi.yaml
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "No schema drift detected."
          elif [ "$rc" -eq 1 ]; then
            echo ""
            echo "::error::Committed openapi.yaml is out of sync with code."
            echo "::error::Regenerate with: make genschema"
            echo ""
            echo "## Schema Drift Detected" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "The committed \`openapi.yaml\` does not match what \`drf-spectacular\` generates from the current code." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            TOTAL_LINES=$(git diff openapi.yaml | wc -l)
            echo "Showing first 100 of $TOTAL_LINES diff lines:" >> $GITHUB_STEP_SUMMARY
            echo '```diff' >> $GITHUB_STEP_SUMMARY
            git diff openapi.yaml | head -100 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          else
            echo "::error::git diff failed with exit code $rc"
            exit "$rc"
          fi
